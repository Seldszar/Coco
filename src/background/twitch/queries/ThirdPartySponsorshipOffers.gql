query ThirdPartySponsorshipOffers($creatorID: ID, $first: Int, $after: Cursor) {
  thirdPartySponsorshipOffers(creatorID: $creatorID, first: $first, after: $after) {
    edges {
      node {
        brandName
        brandImageURL
        thirdPartyBrokerOfferURL
        description

        basePay {
          ...money
        }

        averageEarningsPerConvertedUser {
          ...money
        }
      }
    }
  }
}

fragment money on Money {
  currencyCode
  minorUnits
  amount
}
